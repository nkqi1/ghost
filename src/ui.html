<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'"><title>Ghost Browser</title><link rel="stylesheet" href="style.css"></head><body>
<div id="toolbar"><div id="tabs"></div><button id="add" title="New tab">＋</button></div>
<div id="nav"><button id="back" title="Back">←</button><button id="forward" title="Forward">→</button><button id="reload" title="Reload">↻</button><input id="address" spellcheck="false" placeholder="Search or enter address"><button id="ext" title="Extensions">◇</button></div>
<div id="panel" hidden><header><strong>Extensions</strong><button id="hide">✕</button></header><p>Install by Chrome Web Store extension ID (experimental) or select an unpacked extension folder.</p><div class="entry"><input id="extid" placeholder="32-character extension ID"><button id="install">Install</button></div><button id="folder">Load unpacked extension</button><p id="status"></p><div id="installed"></div><small>Chrome Web Store compatibility is not guaranteed. Some extensions require APIs Electron does not implement.</small></div>
<script src="ui.js"></script></body></html>
